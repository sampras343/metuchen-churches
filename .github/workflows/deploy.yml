name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/content/sunday-uploads/**'
      - 'public/content/announcements/**'
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate bulletin manifest
        run: bash scripts/update-bulletins.sh

      - run: npm run build
        env:
          SITE_URL: https://sampras343.github.io
          SITE_BASE: /metuchen-churches/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
